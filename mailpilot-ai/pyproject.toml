[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailpilot-ai"
version = "0.3.0"
description = "Privacy-first Gmail inbox audit and local Ollama semantic classification and human review (read-only)"
requires-python = ">=3.10"
dependencies = ["google-api-python-client>=2.140", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2", "streamlit>=1.35", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailpilot = "mailpilot.cli:main"
mailpilot-triage = "mailpilot.triage:main"
mailpilot-semantic = "mailpilot.semantic_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
